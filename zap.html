<h1>Abrindo a lista de espera…</h1>
<p>A mensagem já vem pronta: é só enviar e você entra na lista de espera do Não Quero Pensar.</p>
<a class="zap" id="zap" href="https://wa.me/5511992690310?text=Oi!%20Quero%20entrar%20na%20lista%20de%20espera%20do%20N%C3%A3o%20Quero%20Pensar.">Abrir o WhatsApp</a>
</main>
<script>
// Anúncio (26/11): sair do Instagram para o WhatsApp exige 2 confirmações e ninguém completava.
// Agora a pessoa cai direto na página da lista: entra pelo formulário ali mesmo, sem sair do app,
// ou pelo botão do WhatsApp (com a origem). O ?de= segue junto para medir.
const de = (new URLSearchParams(location.search).get("de") || "").toLowerCase();
location.replace("lista" + (/^[a-z0-9_]{1,20}$/.test(de) ? `?de=${de}` : ""));
</script>
