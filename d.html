<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="icon" href="favicon-32.png" sizes="32x32"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mandar a dica · Não Quero Pensar</title>
<meta name="robots" content="noindex">
<meta name="description" content="Uma dica escolhida pelo Não Quero Pensar. Uma coisa a menos pra pensar.">
<meta property="og:title" content="Não Quero Pensar"><meta property="og:description" content="Diga no que você não quer pensar e receba uma escolha pronta no WhatsApp."><meta property="og:image" content="https://naoqueropensar.com.br/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--creme:#F7F1E8;--tinta:#3A2E28;--laranja:#D2603A;--tomate:#A8472A;--suave:#665850}
*{box-sizing:border-box}body{margin:0;background:var(--creme);color:var(--tinta);font:16px/1.6 Inter,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 20px 64px;text-align:center}a{color:var(--tomate)}
h1{font-family:Rubik,Inter,sans-serif;font-weight:800;font-size:1.8rem;line-height:1.15;letter-spacing:-.02em;margin:1em 0 .4em}
.dica{background:#fff;border-radius:14px;padding:16px;margin:20px 0;text-align:left;white-space:pre-line;min-height:3.2em}
.cta{display:inline-block;background:var(--laranja-texto,#A8472A);color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px}
.cta[hidden]{display:none}.suave{color:var(--suave);font-size:.9rem;margin-top:28px}
</style></head><body><main>
<a href="/"><img src="logo.svg" alt="Não Quero Pensar" style="height:48px"></a>
<h1 id="titulo">Abrindo o WhatsApp…</h1>
<div class="dica" id="dica" aria-live="polite"></div>
<a class="cta" id="abrir" hidden>Mandar no WhatsApp</a>
<p class="suave">Uma coisa a menos pra pensar. <a href="/">Conheça o Não Quero Pensar</a></p>
</main><script>
(async function () {
  var titulo = document.getElementById("titulo"), dica = document.getElementById("dica"), abrir = document.getElementById("abrir");
  function falhou() { titulo.textContent = "Não achei essa dica"; dica.textContent = "O link pode ter expirado. Peça outra dica no WhatsApp ou conheça o serviço."; }
  var codigo = new URLSearchParams(location.search).get("i") || "";
  if (!/^[a-z0-9]{6,12}$/.test(codigo)) return falhou();
  try {
    var r = await fetch("https://xvkxxdaqvkbctfznatoo.supabase.co/functions/v1/dica?i=" + codigo);
    if (!r.ok) return falhou();
    var texto = (await r.json()).texto;
    var destino = "https://wa.me/?text=" + encodeURIComponent(texto);
    dica.textContent = texto;
    titulo.textContent = "Mande pra galera";
    abrir.href = destino; abrir.hidden = false;
    location.href = destino;
  } catch (e) { falhou(); }
})();
</script></body></html>
