<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>enviar</title>
<script>
// Ferramenta interna: entrega uma imagem desta pasta para a janela que abriu esta página (só para business.facebook.com).
(async () => {
  const nome = new URLSearchParams(location.search).get("img") || "teaser-01.png";
  const b = await (await fetch(nome + "?v=" + Date.now())).blob();
  if (window.opener) window.opener.postMessage({ tipo: "nqp_imagem", nome, blob: b }, "https://business.facebook.com");
  document.body.textContent = window.opener ? "enviado " + b.size : "sem opener";
})();
</script>
